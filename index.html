
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JaowSakura | Link in Bio</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#090909,#1a1a1a,#000);
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      width:90%;
      max-width:420px;
      text-align:center;
      padding:40px 20px;
    }

    .profile{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid #d4af37;
      margin-bottom:18px;
    }

    h1{
      font-size:28px;
      margin-bottom:8px;
    }

    p{
      color:#bdbdbd;
      margin-bottom:25px;
    }

    .link{
      display:block;
      text-decoration:none;
      color:white;
      background:#181818;
      border:1px solid #333;
      padding:16px;
      border-radius:16px;
      margin:12px 0;
      transition:.25s;
    }

    .link:hover{
      transform:translateY(-3px);
      background:#d4af37;
      color:black;
    }

    footer{
      margin-top:25px;
      color:#777;
      font-size:13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      class="profile"
      src="https://images.unsplash.com/photo-1494790108377-be9c29b29330"
      alt="Profile"
    >

    <h1>JaowSakura</h1>

    <p>
      Welcome to my official profile ✦
    </p>

    <a class="link" href="#">
      🌸 Facebook
    </a>

    <a class="link" href="#">
      💬 Discord
    </a>

    <a class="link" href="#">
      🎮 Khui AI
    </a>

    <a class="link" href="#">
      📸 Instagram
    </a>

    <footer>
      © 2026 JaowSakura
    </footer>

  </div>

</body>
</html>
